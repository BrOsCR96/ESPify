      property="og:title"
      content="ESPify - Manage and flash ESP microcontrollers"

    <link rel="icon" type="image/svg+xml" href="/icon.ico" />

    <link
      rel="preload"
      href="/fonts/geist-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script>
      ;(function () {
        try {
          const theme = localStorage.getItem("theme") || "system"
          const isDark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          const root = document.documentElement
          root.classList.remove("light", "dark")
          root.classList.add(isDark ? "dark" : "light")
          root.style.colorScheme = isDark ? "dark" : "light"
        } catch (e) {}
      })()
    </script>

      class="sr-only focus:not-sr-only focus:absolute focus:z-50 focus:m-2 focus:rounded-md focus:bg-background focus:px-4 focus:py-2 focus:text-sm focus:font-medium focus:text-foreground focus:ring-2 focus:ring-primary"
    >

    </a>

  </body>
